<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CapKing Store - Iniciar sesión</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
  <script src="https://kit.fontawesome.com/dd4a418d4e.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/cart.css">
  <link rel="stylesheet" href="css/register.css">
</head>
<body>
<header>
  <nav class="navbar">
    <ul class="nav-links">
      <li><a href="home.html">Inicio</a></li>
      <li><a href="home.html#productos">Productos</a></li>
      <li><a href="about.html">Nosotros</a></li>
      <li><a href="blogs.html">Blogs</a></li>
      <li><a href="contacto.html">Contacto</a></li>
    </ul>
    <div class="logo">
      <img src="assets/images/logo_capking_white.png" alt="CapKing Store Logo">
    </div>
    <div class="nav-actions">
      <a href="login.html" class="mini-btn" aria-current="page" style="pointer-events:none; opacity:.55;"><i class="fa-solid fa-user"></i> Acceder</a>
      <a href="carrito.html" aria-label="Carrito"><i id="cart-icon" class="fa-solid fa-cart-shopping"></i></a>
    </div>
  </nav>
</header>

<main>
  <section class="hero">
    <div class="hero-content">
      <h1>Iniciar sesión</h1>
        
      <form id="formLogin" class="form" novalidate>
        <!-- Correo -->
        <div class="field full">
          <label for="correo">Correo</label>
            <input id="correo" name="correo" type="email" placeholder="tu@duoc.cl" required maxlength="100">
            <small class="hint">Permitidos: @duoc.cl, @profesor.duoc.cl, @gmail.com</small>
            <small id="err-correo" class="error"></small>
        </div>

        <!-- Password -->
        <div class="field full">
          <label for="pass">Contraseña</label>
          <input id="pass" name="pass" type="password" placeholder="••••" required minlength="4" maxlength="10" autocomplete="current-password">
          <small id="err-pass" class="error"></small>
        </div>

        <!-- Opciones -->
        <div class="field">
          <label style="font-weight:500; font-size:.85rem;">
            <input type="checkbox" id="remember" name="remember" style="width:auto; margin-right:6px; accent-color:#ffd54a;">
            Recuérdame
          </label>
        </div>

        <button type="submit" class="btn">Entrar</button>

        <div class="field full" style="text-align:center; font-size:.85rem; color:#cfcfcf;">
          ¿No tienes cuenta?
          <a href="register.html" style="color:#ffd54a; text-decoration:none; font-weight:600;">Crear cuenta</a>
        </div>
      </form>
    </div>
  </section>
</main>

  <script src="js/login.js" defer></script>
  <script src="js/navbar.js" defer></script>
  <script src="js/cart.js" defer></script>
  <script src="js/auth.js" defer></script>
</body>
</html>
