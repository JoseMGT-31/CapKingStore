<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CapKing Store - Registro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <script src="https://kit.fontawesome.com/dd4a418d4e.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/cart.css">
    <link rel="stylesheet" href="css/register.css"> 
</head>
<body>
    <header>
        <nav class="navbar">
            <ul class="nav-links">
                <li><a href="home.html">Inicio</a></li>
                <li><a href="home.html#productos">Productos</a></li>
                <li><a href="about.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
            <div class="logo">
               <img src="assets/images/logo_capking_white.png" alt="CapKing Store Logo">
            </div>
            <div class="nav-actions">
                <a href="login.html" class="mini-btn"><i class="fa-solid fa-user"></i> Acceder</a>
                <a href="carrito.html" aria-label="Carrito"><i id="cart-icon" class="fa-solid fa-cart-shopping"></i></a>
            </div>
        </nav>
    </header>


    <main>
        <section class="hero">
            <div class="hero-content">
                <form id="formRegistro" class="form">
                    <!-- RUN -->
                    <div class="field">
                        <label for="run">RUN (sin puntos ni guion)</label>
                        <input id="run" name="run" type="text" placeholder="19011022K" required minlength="7" maxlength="9">
                        <small class="error" id="err-run"></small>
                    </div>

                    <!-- Nombres -->
                    <div class="field">
                        <label for="nombre">Nombre</label>
                        <input id="nombre" name="nombre" type="text" required maxlength="50" placeholder="Tu nombre">
                        <small class="error" id="err-nombre"></small>
                    </div>

                    <!-- Apellidos -->
                    <div class="field">
                        <label for="apellidos">Apellidos</label>
                        <input id="apellidos" name="apellidos" type="text" required maxlength="100" placeholder="Tus apellidos">
                        <small class="error" id="err-apellidos"></small>
                    </div>

                    <!-- Correo -->
                    <div class="field">
                        <label for="correo">Correo</label>
                        <input id="correo" name="correo" type="email" required maxlength="100" placeholder="tu@duoc.cl">
                        <small class="hint">Permitidos: @duoc.cl, @profesor.duoc.cl, @gmail.com</small>
                        <small class="error" id="err-correo"></small>
                    </div>

                    <!-- Fecha nacimiento (opcional) -->
                    <div class="field">
                        <label for="fnac">Fecha de nacimiento (opcional)</label>
                        <input id="fnac" name="fnac" type="date">
                        <small class="error" id="err-fnac"></small>
                    </div>

                    <!-- Dirección -->
                    <div class="field">
                        <label for="direccion">Dirección</label>
                        <input id="direccion" name="direccion" type="text" required maxlength="300" placeholder="Calle 123, Depto 45">
                        <small class="error" id="err-direccion"></small>
                    </div>

                    <!-- (Campos de región y comuna eliminados) -->

                    <!-- Contraseña -->
                    <div class="field">
                        <label for="pass">Contraseña (4 a 10 caracteres)</label>
                        <input id="pass" name="pass" type="password" required minlength="4" maxlength="10" placeholder="••••">
                        <small class="error" id="err-pass"></small>
                    </div>

                    <!-- Confirmación -->
                    <div class="field">
                        <label for="pass2">Confirmar contraseña</label>
                        <input id="pass2" name="pass2" type="password" required minlength="4" maxlength="10" placeholder="••••">
                        <small class="error" id="err-pass2"></small>
                    </div>

                    <button type="submit" class="btn">Crear cuenta</button>
                    <div class="field full" style="text-align:center; font-size:.85rem; color:#cfcfcf;">
                        ¿Ya tienes cuenta?
                        <a href="login.html" style="color:#ffd54a; text-decoration:none; font-weight:600;">Iniciar sesion</a>
                    </div>
                </form>
            </div>
        </section>
    </main>
<script>
 (function(){
     const form = document.getElementById('formRegistro');
     const run = document.getElementById('run');
     const nombre = document.getElementById('nombre');
     const apellidos = document.getElementById('apellidos');
     const correo = document.getElementById('correo');
     const fnac = document.getElementById('fnac');
     const direccion = document.getElementById('direccion');
     const pass = document.getElementById('pass');
     const pass2 = document.getElementById('pass2');
    // Campos región y comuna eliminados
     const domains = ['duoc.cl','profesor.duoc.cl','gmail.com'];

     function setError(el, msg){ const small = el.parentElement.querySelector('.error'); if(small){ small.textContent = msg||''; } el.parentElement.classList.toggle('error', !!msg); }

     function valRun(){
         const v = run.value.trim();
         if(!v){ setError(run,'Requerido'); return false; }
         if(v.length < 7 || v.length > 9){ setError(run,'Longitud inválida'); return false; }
         if(!/^[0-9kK]+$/.test(v)){ setError(run,'Formato inválido'); return false; }
         if(!window.Auth.validarRun(v.toUpperCase())){ setError(run,'RUN no válido'); return false; }
         setError(run,''); return true;
     }
     function valNombre(){ const v = nombre.value.trim(); if(!v) { setError(nombre,'Requerido'); return false; } if(v.length>50){ setError(nombre,'Máx 50'); return false;} setError(nombre,''); return true; }
     function valApellidos(){ const v = apellidos.value.trim(); if(!v){ setError(apellidos,'Requerido'); return false;} if(v.length>100){ setError(apellidos,'Máx 100'); return false;} setError(apellidos,''); return true; }
     function valCorreo(){ const v=correo.value.trim().toLowerCase(); if(!v){ setError(correo,'Requerido'); return false;} if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){ setError(correo,'Formato'); return false;} const domain = v.split('@')[1]; if(!domains.includes(domain)){ setError(correo,'Dominio no permitido'); return false;} setError(correo,''); return true; }
     function valDir(){ const v=direccion.value.trim(); if(!v){ setError(direccion,'Requerido'); return false;} if(v.length>300){ setError(direccion,'Máx 300'); return false;} setError(direccion,''); return true; }
     function valPass(){ const v=pass.value; if(v.length<4){ setError(pass,'Mín 4'); return false;} if(v.length>10){ setError(pass,'Máx 10'); return false;} setError(pass,''); return true; }
     function valPass2(){ if(pass2.value!==pass.value){ setError(pass2,'No coincide'); return false;} setError(pass2,''); return true; }
    // Validaciones de región y comuna eliminadas

     [run,nombre,apellidos,correo,direccion,pass,pass2].forEach(el=> el.addEventListener('blur', ()=>{ switch(el){
         case run: valRun(); break; case nombre: valNombre(); break; case apellidos: valApellidos(); break; case correo: valCorreo(); break; case direccion: valDir(); break; case pass: valPass(); break; case pass2: valPass2(); break; }
     }));

     // Lógica de regiones/comunas eliminada

     form.addEventListener('submit', e=>{
         e.preventDefault();
         const ok = [valRun(), valNombre(), valApellidos(), valCorreo(), valDir(), valPass(), valPass2()].every(Boolean);
         if(!ok) return;
         // username a partir del correo (antes de @) evitando colisiones
         let username = correo.value.trim().split('@')[0];
         const existing = window.Auth.users();
         let suffix = 1; const base = username;
         while(existing.some(u=>u.username===username)){ username = base + suffix++; }
         const data = {
             username,
             run: run.value.trim().toUpperCase(),
             nombre: nombre.value.trim(),
             apellidos: apellidos.value.trim(),
             email: correo.value.trim().toLowerCase(),
             role: 'cliente',
             direccion: direccion.value.trim(),
             fnac: fnac.value || '',
             pass: pass.value
         };
         const res = window.Auth.register(data);
         if(!res.ok){ alert(res.msg); return; }
         alert('Cuenta creada. Ahora puedes iniciar sesión.');
         location.href='login.html';
     });
 })();
</script>
<script src="js/auth.js" defer></script>
<script src="js/navbar.js" defer></script>
<script src="js/cart.js" defer></script>
</body>
</html>
