<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Resumen de Compra - CapKing Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/cart.css">
  <link rel="stylesheet" href="css/checkout.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
  <script src="https://kit.fontawesome.com/dd4a418d4e.js" crossorigin="anonymous"></script>
</head>
<body>
  <header>
    <nav class="navbar">
      <ul class="nav-links">
        <li><a href="home.html">Inicio</a></li>
        <li><a href="home.html#productos">Productos</a></li>
        <li><a href="about.html">Nosotros</a></li>
        <li><a href="blogs.html">Blogs</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
      <div class="logo"><img src="assets/images/logo_capking_white.png" alt="CapKing Store Logo"></div>
      <div class="nav-actions">
        <a href="login.html" class="mini-btn"><i class="fa-solid fa-user"></i> Acceder</a>
        <a href="home.html" aria-label="Carrito"><i id="cart-icon" class="fa-solid fa-cart-shopping"></i></a>
      </div>
    </nav>
  </header>
  <main class="wrap">
    <h1>Resumen de tu compra</h1>
  <div id="checkoutEmpty" class="box is-hidden">
      <p class="empty-msg">Tu carrito está vacío. <a class="mini-link" href="home.html#productos">Ir a productos</a></p>
    </div>
  <div class="resume-grid is-hidden" id="checkoutContent">
      <div class="box">
        <h2>Items</h2>
        <div class="items-list" id="checkoutItems"></div>
      </div>
      <aside class="box">
        <h2>Resumen</h2>
        <div class="summary" id="checkoutSummary"></div>
        <button class="btn-primary" id="btnPagar" type="button">Confirmar compra</button>
  <p class="purchase-note">Al confirmar aceptas nuestros términos y el procesamiento de los datos necesarios para tu pedido.</p>
      </aside>
    </div>
  </main>
  <script src="js/navbar.js" defer></script>
  <script src="js/cart.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Esperar a que cart.js defina Cart
      const wait = () => {
        if(!window.Cart){ return requestAnimationFrame(wait); }
        build();
      };
      wait();
      function money(n){ return n.toLocaleString('es-CL',{style:'currency',currency:'CLP'}); }
      function build(){
        const items = (Cart && Cart.count()) ? JSON.parse(localStorage.getItem('CK_CART_V1')||'[]') : [];
        const emptyBox = document.getElementById('checkoutEmpty');
        const content = document.getElementById('checkoutContent');
        if(!items.length){
          emptyBox.classList.remove('is-hidden');
          return;
        }
        content.classList.remove('is-hidden');
        const list = document.getElementById('checkoutItems');
        list.innerHTML = items.map(it => `
          <div class='r-item'>
            <img src='${it.img}' alt='${it.titulo}'>
            <div>
              <p class='r-item-title'>${it.titulo}</p>
              <p class='r-item-attrs'>${it.attrs||''}</p>
              <p class='r-item-price'>${it.qty} x ${money(it.precio)} = ${money(it.precio*it.qty)}</p>
            </div>
            <p class='r-item-line-total'>${money(it.precio*it.qty)}</p>
          </div>`).join('');
        const subtotal = items.reduce((s,i)=> s + i.precio*i.qty,0);
        const envio = subtotal > 60000 ? 0 : 4990;
        const total = subtotal + envio;
        const summary = document.getElementById('checkoutSummary');
        summary.innerHTML = `
          <div class='summary-row'><span>Subtotal</span><span>${money(subtotal)}</span></div>
          <div class='summary-row'><span>Envío ${envio===0? '(gratis)': ''}</span><span>${money(envio)}</span></div>
          <div class='summary-row total'><span>Total</span><span>${money(total)}</span></div>`;
        document.getElementById('btnPagar').addEventListener('click', ()=>{
          const order = {
            id: 'ORD-' + Date.now().toString(36),
            date: Date.now(),
            items: items,
            total: total,
            status: 'ok',
            customer: 'Cliente invitado'
          };
          const KEY_ORDERS = 'CK_ORDERS_V1';
          let existing = [];
          try { existing = JSON.parse(localStorage.getItem(KEY_ORDERS)) || []; } catch { existing = []; }
          existing.push(order);
          localStorage.setItem(KEY_ORDERS, JSON.stringify(existing));
          alert('Compra confirmada (simulación). Gracias! ID: ' + order.id);
          Cart.clear();
          window.location.href = 'admin.html';
        });
      }
    });
  </script>
</body>
</html>
